<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EditScroll</title>
<style>
  :root {
    --bg: #0c0c0d;
    --surface: #141416;
    --surface-2: #1c1c1f;
    --fg: #f4f4f5;
    --muted: #a1a1aa;
    --subtle: #71717a;
    --border: #2a2a2e;
    --accent: #ececef;
    --accent-fg: #0c0c0d;
    --like: #e11d48;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--fg); min-height: 100vh; }
  button, [role="button"] { cursor: pointer; }
  header {
    position: sticky; top: 0; z-index: 20;
    background: rgba(12,12,13,.92); backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
    padding: 0.75rem 1rem;
    display: flex; align-items: center; gap: 0.75rem;
  }
  header h1 { font-size: 1.35rem; font-weight: 600; letter-spacing: -0.02em; }
  .grow { flex: 1; }
  .btn {
    height: 40px; padding: 0 1rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--surface); color: var(--fg); font-weight: 600; font-size: 0.9rem;
  }
  .btn.primary { background: var(--accent); color: var(--accent-fg); border-color: transparent; }
  .btn:disabled { opacity: 0.5; cursor: wait; }
  .avatar {
    width: 36px; height: 36px; border-radius: 50%; object-fit: cover;
    background: var(--surface-2); display: grid; place-items: center; font-weight: 600; font-size: 0.85rem;
  }
  main { max-width: 600px; margin: 0 auto; padding: 1rem; }
  .tabs { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .tabs button { height: 36px; padding: 0 1rem; border-radius: 999px; border: none; background: transparent; color: var(--muted); }
  .tabs button.on { background: var(--accent); color: var(--accent-fg); }
  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 1rem; }
  .card-body { padding: 1rem; }
  .row { display: flex; align-items: center; gap: 0.6rem; }
  .meta { color: var(--muted); font-size: 0.8rem; }
  .caption { margin: 0.75rem 0; line-height: 1.45; }
  .media { width: 100%; max-height: 520px; object-fit: contain; background: #000; display: block; }
  .actions { display: flex; gap: 0.35rem; padding: 0.35rem 0.5rem 0.6rem; }
  .actions button {
    background: none; border: none; color: var(--muted);
    min-width: 64px; min-height: 44px; border-radius: 999px;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.35rem;
  }
  .actions button svg { width: 22px; height: 22px; }
  .actions button:hover { background: var(--surface-2); color: var(--fg); }
  .actions button.on { color: var(--like); }
  .actions button.on.rp { color: #60a5fa; }
  .vid-wrap { position: relative; background: #000; }
  .vid-wrap .play {
    position: absolute; inset: 0; margin: auto; width: 64px; height: 64px; border-radius: 50%;
    border: none; background: rgba(0,0,0,.55); color: white; font-size: 1.4rem;
  }
  .credit { font-size: 0.8rem; color: var(--muted); padding: 0.5rem 1rem; border-bottom: 1px solid var(--border); }
  .credit strong { color: var(--fg); font-weight: 600; }
  .comments { border-top: 1px solid var(--border); padding: 0.75rem 1rem; }
  .comment { font-size: 0.88rem; margin-bottom: 0.4rem; }
  .comment strong { font-weight: 600; }
  .comment-form { display: flex; gap: 0.5rem; margin-top: 0.5rem; }
  .comment-form input, .field, textarea {
    width: 100%; padding: 0.7rem 0.8rem; border-radius: 8px; border: 1px solid var(--border);
    background: var(--bg); color: var(--fg); font-size: 0.95rem;
  }
  textarea { resize: vertical; min-height: 72px; }
  .modal {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,.65); z-index: 40;
    align-items: flex-end; justify-content: center;
  }
  .modal.open { display: flex; }
  .sheet {
    background: var(--surface); width: 100%; max-width: 480px; border-radius: 16px 16px 0 0;
    padding: 1.25rem; border: 1px solid var(--border);
  }
  @media (min-width: 640px) {
    .modal { align-items: center; }
    .sheet { border-radius: 16px; }
  }
  .error { color: var(--like); font-size: 0.85rem; margin: 0.4rem 0; }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); }
  .progress { height: 6px; background: #222; border-radius: 3px; overflow: hidden; margin: 0.5rem 0; }
  .bar { height: 100%; width: 0; background: var(--accent); }
  .center { min-height: 80vh; display: grid; place-items: center; padding: 1.5rem; }
  .panel { width: 100%; max-w: 380px; max-width: 380px; }
  .panel h2 { font-size: 1.8rem; margin-bottom: 0.4rem; }
  .panel p { color: var(--muted); margin-bottom: 1rem; font-size: 0.95rem; }
  .stack { display: flex; flex-direction: column; gap: 0.6rem; }
  .linkish { background: none; border: none; color: var(--muted); font-size: 0.9rem; margin-top: 0.5rem; }
  .search { height: 36px; border-radius: 999px; border: 1px solid var(--border); background: var(--surface); color: var(--fg); padding: 0 0.8rem; width: 140px; }
  .hits { position: absolute; top: 44px; right: 0; width: 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
  .hits button { width: 100%; text-align: left; background: none; border: none; color: var(--fg); padding: 0.55rem 0.7rem; }
  .hits button:hover { background: var(--surface-2); }
  .stats { color: var(--muted); font-size: 0.85rem; margin-top: 0.4rem; }
</style>
</head>
<body>
<div id="app"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, collection, query, orderBy, limit,
  onSnapshot, addDoc, deleteDoc, serverTimestamp, where, getDocs, updateDoc, increment
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDSSaUxfZBoNNEGRVTw9dMXSqYSBHJJm4Y",
  authDomain: "editscroll-9cc25.firebaseapp.com",
  projectId: "editscroll-9cc25",
  storageBucket: "editscroll-9cc25.firebasestorage.app",
  messagingSenderId: "54477852695",
  appId: "1:54477852695:web:f9a7c22f173a5801fe0c52",
  measurementId: "G-SHQ39HP3XS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const root = document.getElementById("app");
let state = {
  user: null,
  profile: null,
  ready: false,
  view: "feed",
  mode: "all",
  posts: [],
  profileView: null,
  search: "",
  hits: [],
  modal: null,
  error: ""
};

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : String(s);
  return d.innerHTML;
}
function ago(ts) {
  if (!ts) return "";
  const t = ts.toDate ? ts.toDate().getTime() : new Date(ts).getTime();
  const s = Math.max(0, Math.floor((Date.now() - t) / 1000));
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m";
  if (s < 86400) return Math.floor(s / 3600) + "h";
  return Math.floor(s / 86400) + "d";
}
function icons() {
  return {
    heart: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>`,
    heartOn: `<svg viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2"><path d="M12 20s-7-4.4-7-9a4 4 0 0 1 7-2 4 4 0 0 1 7 2c0 4.6-7 9-7 9z"/></svg>`,
    chat: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 18l-2 3V6a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H6z"/></svg>`,
    repost: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>`
  };
}
function avatarHtml(src, name, size = 36) {
  if (src) return `<img class="avatar" src="${esc(src)}" alt="" style="width:${size}px;height:${size}px">`;
  const ch = esc((name || "?").slice(0, 1).toUpperCase());
  return `<span class="avatar" style="width:${size}px;height:${size}px">${ch}</span>`;
}

function render() {
  if (!state.ready) {
    root.innerHTML = `<div class="center"><p class="meta">Loading…</p></div>`;
    return;
  }
  if (!state.user) return renderLanding();
  if (!state.profile) return renderUsername();
  if (state.view === "profile") return renderProfile();
  renderFeed();
}

function renderLanding() {
  root.innerHTML = `
    <div class="center">
      <div class="panel">
        <h2>EditScroll</h2>
        <p>A simple place to share photo and video edits with friends.</p>
        <div class="stack" id="auth-box">
          <input class="field" id="email" type="email" placeholder="Your email">
          <input class="field" id="password" type="password" placeholder="Password (at least 8 letters)">
          <div class="error" id="err"></div>
          <button class="btn primary" id="signin">Sign in</button>
          <button class="btn" id="signup">Create a new account</button>
        </div>
      </div>
    </div>`;
  document.getElementById("signin").onclick = () => doAuth(false);
  document.getElementById("signup").onclick = () => doAuth(true);
}

async function doAuth(isSignUp) {
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const err = document.getElementById("err");
  try {
    if (isSignUp) await createUserWithEmailAndPassword(auth, email, password);
    else await signInWithEmailAndPassword(auth, email, password);
  } catch (e) {
    err.textContent = (e.message || "Could not sign in").replace("Firebase: ", "");
  }
}

function renderUsername() {
  const suggested = (state.user.email || "member").split("@")[0].toLowerCase().replace(/[^a-z0-9_]/g, "").slice(0, 16) || "member";
  root.innerHTML = `
    <div class="center">
      <form class="panel stack" id="name-form">
        <h2>Choose your name</h2>
        <p>This is the name people see on your posts. Your username is like @alex.</p>
        <input class="field" id="display" placeholder="Name people see (Alex)" value="${esc(suggested)}">
        <input class="field" id="username" placeholder="username (alex)" value="${esc(suggested)}">
        <div class="error" id="err"></div>
        <button class="btn primary" type="submit">Continue</button>
        <button class="linkish" type="button" id="out">Sign out</button>
      </form>
    </div>`;
  document.getElementById("out").onclick = () => signOut(auth);
  document.getElementById("name-form").onsubmit = async (e) => {
    e.preventDefault();
    const username = document.getElementById("username").value.trim().toLowerCase().replace(/[^a-z0-9_]/g, "");
    const displayName = document.getElementById("display").value.trim().slice(0, 40);
    const err = document.getElementById("err");
    if (username.length < 3) { err.textContent = "Username must be at least 3 characters."; return; }
    if (!displayName) { err.textContent = "Display name is required."; return; }
    const taken = await getDocs(query(collection(db, "usernames"), where("username", "==", username)));
    if (!taken.empty && taken.docs[0].id !== state.user.uid) { err.textContent = "That username is taken."; return; }
    await setDoc(doc(db, "profiles", state.user.uid), {
      username, displayName, bio: "", avatar: "", createdAt: serverTimestamp()
    });
    await setDoc(doc(db, "usernames", state.user.uid), { username });
    state.profile = { username, displayName, bio: "", avatar: "" };
    render();
    listenFeed();
  };
}

function header() {
  return `
    <header>
      <h1 id="home">EditScroll</h1>
      <div class="grow"></div>
      <div style="position:relative">
        <input class="search" id="search" placeholder="Find someone" value="${esc(state.search)}">
        <div class="hits" id="hits" style="display:none"></div>
      </div>
      <button class="btn primary" id="compose">New post</button>
      <button id="me" title="Your profile" style="background:none;border:none">${avatarHtml(state.profile.avatar, state.profile.displayName, 32)}</button>
      <button class="btn" id="out">Sign out</button>
    </header>`;
}

function wireHeader() {
  document.getElementById("home").onclick = () => { state.view = "feed"; render(); };
  document.getElementById("me").onclick = () => openProfile(state.profile.username);
  document.getElementById("out").onclick = () => signOut(auth);
  document.getElementById("compose").onclick = openCompose;
  const search = document.getElementById("search");
  search.oninput = async () => {
    state.search = search.value;
    const q = state.search.trim().toLowerCase();
    const box = document.getElementById("hits");
    if (q.length < 1) { box.style.display = "none"; return; }
    const snap = await getDocs(query(collection(db, "profiles"), orderBy("username"), limit(20)));
    const hits = snap.docs.map(d => d.data()).filter(p => p.username.includes(q) || (p.displayName || "").toLowerCase().includes(q)).slice(0, 6);
    if (!hits.length) { box.style.display = "none"; return; }
    box.style.display = "block";
    box.innerHTML = hits.map(h => `<button data-u="${esc(h.username)}">${esc(h.displayName)} <span class="meta">@${esc(h.username)}</span></button>`).join("");
    box.querySelectorAll("button").forEach(b => b.onclick = () => openProfile(b.dataset.u));
  };
}

function renderFeed() {
  const list = state.posts.filter(p => state.mode === "all" || state.following.has(p.uid) || p.uid === state.user.uid);
  root.innerHTML = `
    ${header()}
    <main>
      <div class="tabs">
        <button class="${state.mode === "all" ? "on" : ""}" data-m="all">All posts</button>
        <button class="${state.mode === "following" ? "on" : ""}" data-m="following">People I follow</button>
      </div>
      <div id="feed">
        ${list.length ? list.map(postHtml).join("") : `<div class="empty">No posts yet.<br>Tap <strong>New post</strong> to add a photo or video.</div>`}
      </div>
    </main>
    ${modalHtml()}`;
  wireHeader();
  document.querySelectorAll(".tabs button").forEach(b => b.onclick = () => { state.mode = b.dataset.m; render(); });
  wirePosts();
  wireModal();
}

function postHtml(p) {
  const credit = p.repostOf ? `<div class="credit">Reposted from <strong>@${esc(p.originalUsername || "someone")}</strong></div>` : "";
  const I = icons();
  const media = p.mediaKind === "video"
    ? `<div class="vid-wrap"><video class="media" id="vid-${esc(p.id)}" ${p.poster ? `poster="${esc(p.poster)}"` : ""} playsinline preload="metadata"></video><button class="play" data-play="${esc(p.id)}" aria-label="Play">▶</button></div>`
    : (p.mediaUrl ? `<img class="media" src="${esc(p.mediaUrl)}" alt="">` : "");
  const liked = (p.likedBy || []).includes(state.user.uid);
  const shared = state.posts.some(x => x.uid === state.user.uid && x.repostOf === (p.repostOf || p.id));
  return `
    <article class="card" data-id="${esc(p.id)}">
      ${credit}
      <div class="card-body">
        <div class="row">
          ${avatarHtml(p.avatar, p.displayName)}
          <div class="grow">
            <button class="linkish" data-u="${esc(p.username)}" style="color:var(--fg);font-weight:600">${esc(p.displayName || p.username)}</button>
            <div class="meta">@${esc(p.username)} · ${ago(p.createdAt)}</div>
          </div>
          ${p.uid === state.user.uid ? `<button class="linkish" data-del="${esc(p.id)}">Delete</button>` : ""}
        </div>
        ${p.caption ? `<p class="caption">${esc(p.caption)}</p>` : ""}
      </div>
      ${media}
      <div class="actions">
        <button data-like="${esc(p.id)}" class="${liked ? "on" : ""}" aria-label="Like">${liked ? I.heartOn : I.heart}<span>${p.likeCount || 0}</span></button>
        <button data-c="${esc(p.id)}" aria-label="Comments">${I.chat}<span>${p.commentCount || 0}</span></button>
        <button data-rp="${esc(p.id)}" class="rp ${shared ? "on" : ""}" aria-label="Share again">${I.repost}<span>${p.repostCount || 0}</span></button>
      </div>
      <div class="comments" id="c-${esc(p.id)}" style="display:none"></div>
    </article>`;
}

function wirePosts() {
  document.querySelectorAll("[data-u]").forEach(b => b.onclick = () => openProfile(b.dataset.u));
  document.querySelectorAll("[data-like]").forEach(b => b.onclick = () => like(b.dataset.like, b));
  document.querySelectorAll("[data-rp]").forEach(b => b.onclick = () => repost(b.dataset.rp, b));
  document.querySelectorAll("[data-c]").forEach(b => b.onclick = () => toggleComments(b.dataset.c));
  document.querySelectorAll("[data-del]").forEach(b => b.onclick = () => removePost(b.dataset.del));
  document.querySelectorAll("[data-play]").forEach(b => b.onclick = () => playVideo(b.dataset.play, b));
}

function paintLike(btn, on, count) {
  const I = icons();
  btn.classList.toggle("on", on);
  btn.innerHTML = `${on ? I.heartOn : I.heart}<span>${count}</span>`;
}

async function like(id, btn) {
  const post = findPost(id);
  if (!post) return;
  const likedBy = new Set(post.likedBy || []);
  const on = likedBy.has(state.user.uid);
  if (on) likedBy.delete(state.user.uid); else likedBy.add(state.user.uid);
  post.likedBy = [...likedBy];
  post.likeCount = Math.max(0, (post.likeCount || 0) + (on ? -1 : 1));
  if (btn) paintLike(btn, !on, post.likeCount);
  updateDoc(doc(db, "posts", id), { likedBy: post.likedBy, likeCount: post.likeCount }).catch(() => {});
}

function findPost(id) {
  return state.posts.find(p => p.id === id) || (state.profileView?.posts || []).find(p => p.id === id);
}

async function repost(id, btn) {
  const original = findPost(id);
  if (!original) return;
  const sourceId = original.repostOf || id;
  const existing = state.posts.find(p => p.uid === state.user.uid && p.repostOf === sourceId);
  if (existing) {
    state.posts = state.posts.filter(p => p.id !== existing.id);
    if (btn) btn.classList.remove("on");
    deleteDoc(doc(db, "posts", existing.id)).catch(() => {});
    return;
  }
  if (original.uid === state.user.uid && !original.repostOf) return;
  const source = findPost(sourceId) || original;
  if (btn) btn.classList.add("on");
  const ref = await addDoc(collection(db, "posts"), {
    uid: state.user.uid,
    username: state.profile.username,
    displayName: state.profile.displayName,
    avatar: state.profile.avatar || "",
    caption: source.caption || "",
    mediaUrl: source.mediaUrl || "",
    mediaKind: source.mediaKind || "none",
    poster: source.poster || "",
    chunked: !!source.chunked,
    repostOf: sourceId,
    originalUsername: source.username,
    likeCount: 0,
    commentCount: 0,
    repostCount: 0,
    likedBy: [],
    createdAt: serverTimestamp()
  });
  source.repostCount = (source.repostCount || 0) + 1;
  if (btn) btn.querySelector("span").textContent = source.repostCount;
  updateDoc(doc(db, "posts", sourceId), { repostCount: increment(1) }).catch(() => {});
  void ref;
}

async function toggleComments(id) {
  const box = document.getElementById("c-" + id);
  if (!box) return;
  if (box.style.display === "block") { box.style.display = "none"; return; }
  box.style.display = "block";
  if (!box.dataset.ready) {
    box.innerHTML = `<p class="meta">Loading comments…</p>`;
    const snap = await getDocs(query(collection(db, "posts", id, "comments"), orderBy("createdAt")));
    const rows = snap.docs.map(d => d.data());
    box.innerHTML = `<div id="clist-${esc(id)}"></div>
      <div class="comment-form">
        <input id="in-${esc(id)}" placeholder="Write a comment">
        <button class="btn primary" id="go-${esc(id)}">Send</button>
      </div>`;
    const list = document.getElementById("clist-" + id);
    rows.forEach(c => list.insertAdjacentHTML("beforeend", commentHtml(c)));
    if (!rows.length) list.insertAdjacentHTML("beforeend", `<div class="meta" id="empty-${esc(id)}">No comments yet.</div>`);
    document.getElementById("go-" + id).onclick = () => sendComment(id);
    box.dataset.ready = "1";
  }
}

function commentHtml(c) {
  return `<div class="comment"><strong>@${esc(c.username)}</strong> ${esc(c.body)}</div>`;
}

async function sendComment(id) {
  const input = document.getElementById("in-" + id);
  const body = input.value.trim();
  if (!body) return;
  input.value = "";
  const mine = { username: state.profile.username, body: body.slice(0, 280) };
  const empty = document.getElementById("empty-" + id);
  if (empty) empty.remove();
  document.getElementById("clist-" + id).insertAdjacentHTML("beforeend", commentHtml(mine));
  const post = findPost(id);
  if (post) {
    post.commentCount = (post.commentCount || 0) + 1;
    const btn = document.querySelector(`[data-c="${id}"] span`);
    if (btn) btn.textContent = post.commentCount;
  }
  await addDoc(collection(db, "posts", id, "comments"), {
    uid: state.user.uid,
    username: state.profile.username,
    body: mine.body,
    createdAt: serverTimestamp()
  });
  updateDoc(doc(db, "posts", id), { commentCount: increment(1) }).catch(() => {});
}

async function removePost(id) {
  if (!confirm("Delete this post?")) return;
  await deleteDoc(doc(db, "posts", id));
}

function modalHtml() {
  if (state.modal !== "compose") return "";
  return `
    <div class="modal open" id="modal">
      <form class="sheet stack" id="compose-form">
        <h2 style="font-size:1.4rem">New post</h2>
        <textarea id="caption" placeholder="Say something about this edit"></textarea>
        <input class="field" id="file" type="file" accept="image/*,video/*">
        <p class="meta">Photos up to 15 MB. Videos up to 40 MB. Big files take a minute to save.</p>
        <div class="progress" id="prog" style="display:none"><div class="bar" id="bar"></div></div>
        <div class="error" id="cerr"></div>
        <button class="btn primary" type="submit">Post</button>
        <button class="linkish" type="button" id="close">Close</button>
      </form>
    </div>`;
}
function openCompose() { state.modal = "compose"; render(); }
function wireModal() {
  const close = document.getElementById("close");
  if (close) close.onclick = () => { state.modal = null; render(); };
  const form = document.getElementById("compose-form");
  if (!form) return;
  form.onsubmit = async (e) => {
    e.preventDefault();
    const caption = document.getElementById("caption").value.trim();
    const file = document.getElementById("file").files[0];
    const err = document.getElementById("cerr");
    if (!caption && !file) { err.textContent = "Add a caption or a file."; return; }
    try {
      let mediaUrl = "", mediaKind = "none", poster = "";
      if (file) {
        document.getElementById("prog").style.display = "block";
        document.getElementById("bar").style.width = "15%";
        if (file.type.startsWith("video/")) {
          if (file.size > 40 * 1024 * 1024) {
            err.textContent = "That video is over 40 MB. Trim it and try again.";
            return;
          }
          mediaKind = "video";
          poster = await videoPoster(file);
          document.getElementById("bar").style.width = "35%";
          mediaUrl = await readAsDataUrl(file);
        } else if (file.type.startsWith("image/")) {
          mediaKind = "image";
          mediaUrl = await compressImage(file, 1600, 0.82);
          if (mediaUrl.length > 900000) mediaUrl = await compressImage(file, 1280, 0.72);
          if (mediaUrl.length > 900000) mediaUrl = await compressImage(file, 960, 0.6);
          if (mediaUrl.length > 900000) mediaUrl = await compressImage(file, 720, 0.5);
        } else {
          err.textContent = "Please choose a photo or a video.";
          return;
        }
      }
      const chunked = mediaKind === "video";
      const ref = await addDoc(collection(db, "posts"), {
        uid: state.user.uid,
        username: state.profile.username,
        displayName: state.profile.displayName,
        avatar: state.profile.avatar || "",
        caption: caption.slice(0, 500),
        mediaUrl: chunked ? "" : mediaUrl,
        mediaKind, poster,
        chunked,
        chunkCount: 0,
        repostOf: "",
        originalUsername: "",
        likeCount: 0, commentCount: 0, repostCount: 0, likedBy: [],
        createdAt: serverTimestamp()
      });
      if (chunked) {
        await saveChunks(ref.id, mediaUrl, (n) => {
          document.getElementById("bar").style.width = (35 + n * 0.6) + "%";
        });
      }
      state.modal = null;
      render();
    } catch (e2) {
      err.textContent = e2.message || "Could not post. Make sure Firestore is turned on.";
    }
  };
}

function readAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(String(reader.result));
    reader.onerror = () => reject(new Error("Could not read that file."));
    reader.readAsDataURL(file);
  });
}

function videoPoster(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const video = document.createElement("video");
    video.preload = "auto";
    video.muted = true;
    video.src = url;
    const done = (data) => { URL.revokeObjectURL(url); resolve(data || ""); };
    video.onloadeddata = () => {
      try {
        const canvas = document.createElement("canvas");
        canvas.width = 480;
        canvas.height = Math.max(1, Math.round(480 * (video.videoHeight / Math.max(1, video.videoWidth))));
        canvas.getContext("2d").drawImage(video, 0, 0, canvas.width, canvas.height);
        done(canvas.toDataURL("image/jpeg", 0.6));
      } catch { done(""); }
    };
    video.onerror = () => done("");
  });
}

async function saveChunks(postId, dataUrl, onProgress) {
  const size = 700000;
  const parts = [];
  for (let i = 0; i < dataUrl.length; i += size) parts.push(dataUrl.slice(i, i + size));
  for (let i = 0; i < parts.length; i += 1) {
    await setDoc(doc(db, "posts", postId, "chunks", String(i)), { i, data: parts[i] });
    if (onProgress) onProgress(Math.round(((i + 1) / parts.length) * 100));
  }
  await updateDoc(doc(db, "posts", postId), { chunkCount: parts.length });
}

const videoCache = new Map();
function dataUrlToBlob(dataUrl) {
  const parts = String(dataUrl).split(",");
  const mime = (parts[0].match(/:(.*?);/) || [])[1] || "video/mp4";
  const bin = atob(parts[1] || "");
  const arr = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type: mime });
}
async function loadVideo(post) {
  const sourceId = post.repostOf || post.id;
  if (videoCache.has(sourceId)) return videoCache.get(sourceId);
  let data = post.mediaUrl || "";
  if (!data) {
    const snap = await getDocs(collection(db, "posts", sourceId, "chunks"));
    const parts = snap.docs.map(d => d.data()).sort((a, b) => a.i - b.i);
    data = parts.map(p => p.data).join("");
  }
  if (!data) throw new Error("Video pieces were not saved.");
  const url = URL.createObjectURL(dataUrlToBlob(data));
  videoCache.set(sourceId, url);
  return url;
}
async function playVideo(id, btn) {
  const post = findPost(id);
  const el = document.getElementById("vid-" + id);
  if (!post || !el) return;
  btn.textContent = "…";
  try {
    if (!el.src) el.src = await loadVideo(post);
    el.controls = true;
    await el.play();
    btn.remove();
  } catch (e) {
    btn.textContent = "!";
    alert("Could not play that video. Post it again if it is under 40 MB.");
    console.error(e);
  }
}
function compressImage(file, max = 960, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const scale = Math.min(1, max / Math.max(img.width, img.height));
      const canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(img.width * scale));
      canvas.height = Math.max(1, Math.round(img.height * scale));
      canvas.getContext("2d").drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(url);
      resolve(canvas.toDataURL("image/jpeg", quality));
    };
    img.onerror = () => reject(new Error("Could not read that image."));
    img.src = url;
  });
}

async function openProfile(username) {
  const snap = await getDocs(query(collection(db, "profiles"), where("username", "==", username), limit(1)));
  if (snap.empty) { alert("No one by that name."); return; }
  const d = snap.docs[0];
  state.profileView = { uid: d.id, ...d.data() };
  const posts = await getDocs(query(collection(db, "posts"), where("username", "==", username)));
  state.profileView.posts = posts.docs.map(x => ({ id: x.id, ...x.data() })).sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
  const f = await getDoc(doc(db, "follows", state.user.uid + "_" + state.profileView.uid));
  state.profileView.following = f.exists();
  state.view = "profile";
  render();
}

function renderProfile() {
  const p = state.profileView;
  const isMe = p.uid === state.user.uid;
  root.innerHTML = `
    ${header()}
    <main>
      <button class="linkish" id="back">Back to feed</button>
      <div class="row" style="margin-top:1rem;align-items:flex-start">
        ${avatarHtml(p.avatar, p.displayName, 72)}
        <div>
          <h2 style="font-size:1.6rem">${esc(p.displayName)}</h2>
          <div class="meta">@${esc(p.username)}</div>
          ${p.bio ? `<p style="margin-top:0.5rem">${esc(p.bio)}</p>` : ""}
          <div class="stats">${(p.posts || []).length} posts</div>
          <div style="margin-top:0.6rem">
            ${isMe
              ? `<button class="btn" id="edit">Edit my profile</button>`
              : `<button class="btn ${p.following ? "" : "primary"}" id="follow">${p.following ? "Following" : "Follow"}</button>`}
          </div>
        </div>
      </div>
      <div style="margin-top:1.2rem">${(p.posts || []).map(postHtml).join("") || `<div class="empty">No posts yet.</div>`}</div>
    </main>
    ${state.modal === "edit" ? editModal() : ""}`;
  wireHeader();
  document.getElementById("back").onclick = () => { state.view = "feed"; render(); };
  wirePosts();
  if (isMe) document.getElementById("edit").onclick = () => { state.modal = "edit"; render(); };
  else document.getElementById("follow").onclick = async () => {
    const id = state.user.uid + "_" + p.uid;
    if (p.following) await deleteDoc(doc(db, "follows", id));
    else await setDoc(doc(db, "follows", id), { follower: state.user.uid, following: p.uid });
    state.following = state.following || new Set();
    if (p.following) state.following.delete(p.uid); else state.following.add(p.uid);
    p.following = !p.following;
    render();
  };
  const form = document.getElementById("edit-form");
  if (form) {
    document.getElementById("close").onclick = () => { state.modal = null; render(); };
    form.onsubmit = async (e) => {
      e.preventDefault();
      const displayName = document.getElementById("ed-name").value.trim().slice(0, 40);
      const bio = document.getElementById("ed-bio").value.trim().slice(0, 160);
      const file = document.getElementById("ed-file").files[0];
      let avatar = state.profile.avatar || "";
      if (file) {
        avatar = await compressImage(file, 256, 0.7);
        if (avatar.length > 180000) avatar = await compressImage(file, 160, 0.6);
      }
      await updateDoc(doc(db, "profiles", state.user.uid), { displayName, bio, avatar });
      state.profile = { ...state.profile, displayName, bio, avatar };
      state.profileView = { ...state.profileView, displayName, bio, avatar };
      state.modal = null;
      render();
    };
  }
}

function editModal() {
  return `
    <div class="modal open">
      <form class="sheet stack" id="edit-form">
        <h2 style="font-size:1.4rem">Edit profile</h2>
        <input class="field" id="ed-name" value="${esc(state.profile.displayName)}">
        <textarea id="ed-bio" placeholder="Bio">${esc(state.profile.bio || "")}</textarea>
        <input class="field" id="ed-file" type="file" accept="image/*">
        <button class="btn primary" type="submit">Save</button>
        <button class="linkish" type="button" id="close">Close</button>
      </form>
    </div>`;
}

let unsub = null;
function listenFeed() {
  if (unsub) unsub();
  const q = query(collection(db, "posts"), orderBy("createdAt", "desc"), limit(40));
  unsub = onSnapshot(q, (snap) => {
    const next = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    const same = state.posts.length === next.length && state.posts.every((p, i) => p.id === next[i].id);
    state.posts = next;
    if (state.view !== "feed" || !state.profile) return;
    if (same && document.getElementById("feed")) return;
    render();
  }, (err) => {
    console.error(err);
  });
}

onAuthStateChanged(auth, async (user) => {
  state.user = user;
  state.ready = true;
  state.following = new Set();
  if (!user) { state.profile = null; if (unsub) unsub(); render(); return; }
  const pref = await getDoc(doc(db, "profiles", user.uid));
  state.profile = pref.exists() ? pref.data() : null;
  if (state.profile) {
    const follows = await getDocs(query(collection(db, "follows"), where("follower", "==", user.uid)));
    state.following = new Set(follows.docs.map(d => d.data().following));
    listenFeed();
  }
  render();
});
